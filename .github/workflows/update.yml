name: 更新赛事赔率看板

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行更新脚本
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 update_dashboard.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --quiet --cached || (git commit -m "自动更新: $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
